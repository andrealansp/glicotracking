{% extends "base.html" %}
{% block dashboard %}
<!-- Carregue Chart.js PRIMEIRO -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Depois o ChartDataLabels -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

{% endblock %}
{% block content %}


<!--Faixa inicial do dashboard-->
<div class="row m-3">
    <div class="col-sm-12 col-md-6 col-lg-3 col-12 mb-3 ">
        <div class="card bg b-enfase">
            <div class="card-body">
                <h4>Última Medição</h4>
                <span>{{ultima_medicao}}</span>
            </div>
        </div>
    </div>
    <div class="col-sm-12 col-md-6 col-lg-3 col-12 mb-3">
        <div class="card bg b-enfase">
            <div class="card-body">
                <h4>Tempo no Alvo</h4>
                {{tir_percent}} %
            </div>
        </div>
    </div>
    <div class="col-sm-12 col-md-6 col-lg-3 col-12 mb-3">
        <div class="card bg b-enfase">
            <div class="card-body">
                <h4>Glicada Estimada</h4>
                <span>{{glicada_estimada|floatformat:2 }} %</span>
            </div>
        </div>
    </div>
    <div class="col-sm-12 col-md-6 col-lg-3 col-12 mb-3">
        <div class="card bg b-enfase">
            <div class="card-body">
                <h4>Peso Desejado</h4>
                <span>{{peso_ideal}} Kg</span>
            </div>
        </div>
    </div>
</div>


<!-- Gráfico de Glicose -->
<div class="row m-3 ">
    <div class="col-sm-12 col-md-12 col-12 ">
        <div class="card bg overflow-auto">
            <div class="card-body">
                <div id="areadografico">
                    <canvas id="glicoseChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row m-3 ">
    <div class="col-sm-6 col-md-6 col-6 ">
        <div class="card bg overflow-auto">
            <div class="card-body">
                <div id="graficojejum" class="graficos">
                    <canvas id="jejumChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-md-6 col-6 ">
        <div class="card bg overflow-auto">
            <div class="card-body">
                <div id="graficoaleatorias" class="graficos">
                    <canvas id="aleatoriasChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row m-3">
    <div class="col-sm-12 col-md-12 col-12 col-lg-6 mb-3">
        <div class="card bg">
            <div class="card-body">
                <div class="graficos m-auto">
                    <canvas id="graficoPesoImc"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-sm-12 col-md-12 col-lg-6 mb-3">
        <div class="card bg">
            <div class="card-body">
                <div class="graficos m-auto">
                    <canvas id="graficoBiotipo"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);
    // Parse dos dados do Django (inalterado)
    const legendaOriginal = JSON.parse('{{ dados_grafico.legendas|escapejs }}');
    const dadosOriginal = JSON.parse('{{ dados_grafico.dados|escapejs }}');
    const tiposOriginal = JSON.parse('{{ dados_grafico.tipo|escapejs }}');
    const historicoPesoImcData = JSON.parse('{{ historico_peso_imc|escapejs }}');
    const historicoBiotipoData = JSON.parse('{{ historico_biotipo|escapejs }}');
    const legenda = legendaOriginal.reverse();
    const dados = dadosOriginal.reverse();
    const tipos = tiposOriginal.reverse();


    // Ajusta o tamanho do gráfico conforme a quantidade de dados
    if (dados.length > 30) {
        grafico = document.getElementById("areadografico");
        grafico.style.width = "150vw";
        grafico.style.height = "100vh";
    }
    else {
        grafico = document.getElementById("areadografico");
        grafico.style.width = "94vw";
        grafico.style.height = "50vh";
    }

    <!-- Gráfico de Glicose    -->
    // 1. Definimos o Plugin customizado para as linhas horizontais
    const horizontalLinesPlugin = {
        id: 'horizontalLines',
        afterDatasetsDraw(chart, args, options) {
            const { ctx, scales: { x, y } } = chart;

            // Função auxiliar para desenhar a linha
            function drawLine(value, color, text) {
                // Verifica se o valor está dentro da área visível do gráfico
                if (value < y.min || value > y.max) return;

                const yPos = y.getPixelForValue(value);

                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = 2;
                ctx.strokeStyle = color;
                // Cria um efeito tracejado (opcional, fica mais elegante)
                ctx.setLineDash([5, 5]);
                ctx.moveTo(x.left, yPos);
                ctx.lineTo(x.right, yPos);
                ctx.stroke();

                if (text) {
                    ctx.fillStyle = color;
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'right';
                    ctx.fillText(text, x.right - 10, yPos - 10);
                }
                ctx.restore();
            }

            // Desenhando as linhas
            drawLine(180, 'rgba(220, 53, 69, 0.5)', 'Muito Alta');      // Vermelho
            drawLine(160, 'rgba(253, 126, 20, 0.5)', 'Alta');            // Laranja
            drawLine(100, 'rgba(32, 201, 151, 0.5)', 'Normal Jejum');    // Verde Água
            drawLine(70, 'rgba(0, 123, 255, 0.5)', 'Hipoglicemia');     // Azul
        }
    };

    // 2. Configuração do Gráfico
    const ctxGlicose = document.getElementById('glicoseChart').getContext('2d');
    const coresbarras = {
        'jejum': '#FFC107',  // Amarelo dourado
        'aleatoria': '#007BFF',  // Azul
        'pos_pandrial_2h': '#28A745',  // Verde
        'pos_prandial_1h': '#FD7E14',  // Laranja
        'pre_prandial': '#DC3545',  // Vermelho
    };
    const coresBarras = tipos.map(tipo => coresbarras[tipo]);
    const uniqueTypes = [...new Set(tipos)];

    new Chart(ctxGlicose, {
        type: 'bar',
        data: {
            labels: legenda,
            datasets: [{
                fill: true,
                label: 'Glicose (Últimos 30 dias)',
                data: dados,
                tipos: tipos,
                borderColor: coresBarras.map(cor => cor + '80'),
                backgroundColor: coresBarras,
                borderWidth: 1,
                borderRadius: 4,
                barPercentage: 0.5,
                categoryPercentage: 0.8
            }]
        },
        plugins: [ChartDataLabels, horizontalLinesPlugin],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    suggestedMin: 50,
                    suggestedMax: 200,
                }
            },
            plugins: {
                tooltip: {
                    enabled: true,
                    backgroundColor: 'black',
                    titleColor: 'white',
                    bodyColor: 'white',
                    borderColor: 'rgba(0, 0, 0, 0.8)',
                    borderWidth: 1,
                    cornerRadius: 6,
                    displayColors: false,
                    callbacks: {
                        title: function (context) {
                            return `Data: ${context[0].label}`;
                        },
                        label: function (context) {
                            const valor = Math.round(context.parsed.y);
                            return `Glicose: ${valor} mg/dL`;
                        },
                        afterLabel: function (context) {
                            const tipo = context.dataset.tipos[context.dataIndex] || 'Desconhecido';
                            return `Tipo: ${tipo.toUpperCase()}`;
                        }
                    }
                },
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    textAlign: 'center',
                    backgroundColor: coresBarras.map(cor => cor + '80'),
                    borderRadius: 4,
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 11,
                        lineHeight: 1.4
                    },
                    padding: 8,
                    offset: 12,
                    formatter: function (value, context) {
                        const tipo = context.dataset.tipos ? context.dataset.tipos[context.dataIndex] : 'Desconhecido';
                        const valorArredondado = Math.round(value);
                        return `${valorArredondado}`;  // Valor em cima, tipo centralizado abaixo
                    }
                },
                title: {
                    display: true,
                    text: 'Monitoramento de Glicose (Últimos 30 Dias)',
                    font: { size: 16 }
                },
                legend: {
                    labels: {
                        generateLabels: function (chart) {
                            const datasets = chart.data.datasets;
                            if (datasets.length > 0) {
                                const tiposUnicos = [...new Set(datasets[0].tipos)];
                                return tiposUnicos.map(tipo => {
                                    const cor = coresbarras[tipo] || '#000000';
                                    return {
                                        text: tipo.charAt(0).toUpperCase() + tipo.slice(1).replace('_', ' '),
                                        fillStyle: cor,
                                        strokeStyle: cor,
                                        lineWidth: 1
                                    };
                                });
                            }
                        }
                    }
                }
            }
        }
    });


    const dadosJejum = dadosOriginal.filter((_, index) => tiposOriginal[index] === 'jejum').reverse();
    const legendaJejum = legendaOriginal.filter((_, index) => tiposOriginal[index] === 'jejum').reverse();

    // Gráfico Jejum
    const ctxJejum = document.getElementById('jejumChart').getContext('2d');
    const jejumChart = new Chart(ctxJejum, {
        type: 'line',
        data: {
            labels: legendaJejum,
            datasets: [{
                label: 'Glicose em Jejum (mg/dL) (últimos 30 dias)',
                data: dadosJejum,
                borderColor: 'rgba(255, 193, 7, 1)',
                backgroundColor: 'rgba(255, 193, 7, 0.3)',
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointBackgroundColor: 'rgba(255, 193, 7, 1)',
                pointBorderColor: 'rgba(255, 193, 7, 1)',
                pointBorderWidth: 1
            }]
        },
        plugins: [ChartDataLabels],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'Glicose em Jejum',
                    font: { size: 16 }
                },
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    textAlign: 'center',
                    backgroundColor: '#FFC107',
                    borderRadius: 4,
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 11,
                        lineHeight: 1.4
                    },
                    padding: 8,
                    offset: 12,
                    formatter: function (value, context) {
                        const tipo = context.dataset.tipos ? context.dataset.tipos[context.dataIndex] : 'Desconhecido';
                        const valorArredondado = Math.round(value);
                        return `${valorArredondado}`;  // Valor em cima, tipo centralizado abaixo
                    }
                },
                title: {
                    display: true,
                    text: 'Glicose em Jejum (Últimos 30 Dias)',
                    font: { size: 16 }
                },
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    suggestedMin: 50,
                    suggestedMax: 200
                }
            }
        }
    })


    const dadosaletorios = dadosOriginal.filter((_, index) => tiposOriginal[index] === 'aleatoria').reverse();
    const legendaaleatorios = legendaOriginal.filter((_, index) => tiposOriginal[index] === 'aleatoria').reverse();

    const ctxAleatorias = document.getElementById('aleatoriasChart').getContext('2d');
    const aleatoriasChart = new Chart(ctxAleatorias, {
        type: 'line',
        data: {
            labels: legendaaleatorios,
            datasets: [{
                label: 'Medições Aleatórias(mg/dL) (últimos 30 dias)',
                data: dadosaletorios,
                borderColor: '#007BFF',
                backgroundColor: 'rgba(0, 123, 255, 0.3)',
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointBackgroundColor: '#007BFF',
                pointBorderColor: '#007BFF',
                pointBorderWidth: 1
            }]
        },
        plugins: [ChartDataLabels],
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'Glicose em Jejum',
                    font: { size: 16 }
                },
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    textAlign: 'center',
                    backgroundColor: '#007BFF',
                    borderRadius: 4,
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 11,
                        lineHeight: 1.4
                    },
                    padding: 8,
                    offset: 12,
                    formatter: function (value, context) {
                        const tipo = context.dataset.tipos ? context.dataset.tipos[context.dataIndex] : 'Desconhecido';
                        const valorArredondado = Math.round(value);
                        return `${valorArredondado}`;  // Valor em cima, tipo centralizado abaixo
                    }
                },
                title: {
                    display: true,
                    text: 'Medidas Aleatórias (Últimos 30 Dias)',
                    font: { size: 16 }
                },
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    suggestedMin: 50,
                    suggestedMax: 200
                }
            }
        }

    })


    const dados_labels = historicoPesoImcData.map(item => new Date(item.data_registro).toLocaleDateString());
    const dados_peso_ideal = Array(dados_labels.length).fill({{ peso_ideal }});

    // Gráfico de barras agrupadas com peso e IMC
    const ctxPesoImc = document.getElementById('graficoPesoImc').getContext('2d');
    const graficoPesoImc = new Chart(ctxPesoImc, {
        type: 'line',
        data: {
            labels: dados_labels,
            datasets: [{
                label: 'Peso (kg)',
                data: historicoPesoImcData.map(item => parseFloat(item.peso)),
                backgroundColor: 'rgb(75, 192, 192)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1,
                yAxisID: 'y-peso',
                categoryPercentage: 0.5, tension: 0.3,
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    color: 'black',
                    font: {
                        size: 12,
                        weight: 'bold'
                    },
                    formatter: function (value, context) {
                        return value;
                    },
                    offset: -25
                }
            }, {
                label: 'IMC',
                data: historicoPesoImcData.map(item => parseFloat(item.imc)),
                backgroundColor: 'rgb(255, 206, 86)',
                borderColor: 'rgba(255, 206, 86, 1)',
                categoryPercentage: 0.5,
                borderWidth: 1,
                yAxisID: 'y-imc',
                datalabels: {
                    align: 'top',
                    anchor: 'end',
                    offset: -25,
                    color: 'black',
                    font: {
                        size: 12,
                        weight: 'bold'
                    },
                    formatter: function (value, context) {
                        return value;
                    }
                }
            }, {
                type: 'line',
                label: 'Peso Ideal',
                data: dados_peso_ideal,
                backgroundColor: 'rgba(0, 0, 192, 0.1)',
                borderColor: 'rgba(0, 0, 192, 0.5)',
                borderWidth: 2,
                yAxisID: 'y-peso',
                fill: false,
                tension: 0.1,
                spanGaps: true,
                pointRadius: 3,
                pointBackgroundColor: 'rgba(0, 0, 192, 1)',
                pointBorderColor: 'rgba(0, 0, 192, 1)',
                pointBorderWidth: 1,
                order: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Peso e IMC'
                },
                datalabels: {
                    display: true
                }
            },
            scales: {
                'y-peso': {
                    type: 'linear',
                    position: 'left',
                    stacked: false,
                    grace: 10,
                    grid: { // Alterada: Remove grade (substitui drawOnChartArea)
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Peso (kg)'
                    }
                },
                'y-imc': {
                    type: 'linear',
                    position: 'right',
                    grace: 5,
                    title: {
                        display: true,
                        text: 'IMC'
                    },
                    grid: { // Alterada: Remove grade (substitui drawOnChartArea)
                        display: false
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Data'
                    }
                }
            },
            elements: {
                line: {
                    borderWidth: 2 // Reforça espessura da linha para visibilidade sobre barras
                }
            },
            interaction: {
                intersect: false // Permite hover em toda a linha, não só nos pontos
            }
        }
    });
    // --- Gráfico de Biotipo ---
    const ctxBiotipo = document.getElementById('graficoBiotipo').getContext('2d');
    const graficBiotipo = new Chart(ctxBiotipo, {
        type: 'bar',  // ← Mudou de 'line' para 'bar'
        data: {
            labels: historicoBiotipoData.map(item => new Date(item.data_registro).toLocaleDateString()),
            grouped: true,
            datasets: [{
                label: 'Cintura',
                data: historicoBiotipoData.map(item => parseFloat(item.cintura)),
                backgroundColor: 'rgb(49, 103, 237)',
                borderColor: 'rgb(49, 103, 237)',
                borderWidth: 1,
                categoryPercentage: 0.5,
                datalabels: {
                    align: 'end',
                    anchor: 'top',
                    offset: -25,
                    textAlign: "center",
                    anchor: "end",
                    formatter: function (value) {
                        return value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            }, {
                label: 'Quadril',
                data: historicoBiotipoData.map(item => parseFloat(item.quadril)),
                backgroundColor: 'rgba(50, 182, 41, 0.9)',
                borderColor: 'rgba(50, 182, 41, 1)',
                borderWidth: 1,
                categoryPercentage: 0.5,
                datalabels: {
                    align: 'end',
                    anchor: 'top',
                    offset: -25,
                    textAlign: "center",
                    anchor: "end",
                    formatter: function (value) {
                        return value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            }, {
                label: 'Braços',
                data: historicoBiotipoData.map(item => parseFloat(item.braço)),
                backgroundColor: 'rgba(255, 159, 64, 0.9)',
                borderColor: 'rgba(255, 159, 64, 1)',
                borderWidth: 1,
                categoryPercentage: 0.5,
                datalabels: {
                    align: 'end',
                    anchor: 'top',
                    offset: -25,
                    textAlign: "center",
                    anchor: "end",
                    formatter: function (value) {
                        return value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            }, {
                label: 'Perna',
                data: historicoBiotipoData.map(item => parseFloat(item.perna)),
                backgroundColor: 'rgba(153, 102, 255, 0.9)',
                borderColor: 'rgba(153, 102, 255, 1)',
                borderWidth: 1,
                categoryPercentage: 0.5,
                datalabels: {
                    align: 'end',
                    anchor: 'top',
                    offset: -25,
                    textAlign: "center",
                    anchor: "end",
                    formatter: function (value) {
                        return value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            }, {
                label: 'Abdômen',
                data: historicoBiotipoData.map(item => parseFloat(item.abdomen)),
                backgroundColor: 'rgba(255, 99, 132, 0.9)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1,
                categoryPercentage: 0.5,
                datalabels: {
                    align: 'end',
                    anchor: 'top',
                    offset: -25,
                    textAlign: "center",
                    anchor: "end",
                    formatter: function (value) {
                        return value;
                    },
                    color: 'black',
                    font: {
                        weight: 'bold',
                        size: 10
                    }
                }
            }]
        },
        options: {
            responsive: true,
            mantainAspectRatio: true,
            scales: {
                y: {
                    min: 0,
                    max: 190,
                    title: {
                        display: true,
                        text: 'Circunferência (CM)'
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Data'
                    }
                }
            },
            plugins: {
                title: {
                    display: true,
                    text: 'Biotipo'
                }
            }
        }
    });
</script>
{% endblock %}
