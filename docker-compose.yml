version: '3.8'

services:
  bancodados:
    image: postgres:17-bullseye
    restart: always
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)'"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_user
      - db_name
      - db_password
    networks:
      - alvesdevpynet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Apenas para debug local; remova em prod se não precisar

  web:
    image: glicotracking:v2
    entrypoint: ["/app/entrypoint.sh"]
    command: ["gunicorn", "app.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]
    environment:
      - secret_key=/run/secrets/secret_key
      - database_url=/run/secrets/database_url
      - db_name=/run/secrets/db_name
      - db_password=/run/secrets/db_password
      - db_user=/run/secrets/db_user
      - DEBUG=False
      - ALLOWED_HOSTS=glicotracking.alvesdevpy.com.br
    volumes:
      - glico_data:/app/glicotracking
      - static_volume:/app/staticfiles  # Compartilhado com nginx
      - media_volume:/app/media  # Compartilhado com nginx
    networks:
      - alvesdevpynet
    depends_on:
      bancodados:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.web.rule=Host(`glicotracking.alvesdevpy.com.br`)"
        - "traefik.http.routers.web.entrypoints=websecure"
        - "traefik.http.routers.web.priority=1"
        - "traefik.http.routers.web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.web.loadbalancer.server.port=8000"
        - "traefik.http.services.web.loadbalancer.passHostHeader=true"

  nginx:
    image: nginx:alpine
    volumes:
      - static_volume:/app/staticfiles:ro  # Apenas leitura
      - media_volume:/app/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Arquivo de config local
    networks:
      - alvesdevpynet
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.nginx.rule=Host(`glicotracking.alvesdevpy.com.br`)"
        - "traefik.http.routers.nginx.entrypoints=websecure"
        - "traefik.http.routers.nginx.priority=2"  # Maior prioridade que web para /static/ e /media/
        - "traefik.http.routers.nginx.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.nginx.loadbalancer.server.port=80"
        - "traefik.http.services.nginx.loadbalancer.passHostHeader=true"

volumes:
  pgdata:
  glico_data:
  static_volume:
  media_volume:

networks:
  alvesdevpynet:
    external: true
    driver: overlay

secrets:
  secret_key:
    external: true
  database_url:
    external: true
  db_name:
    external: true
  db_password:
    external: true
  db_user:
    external: true